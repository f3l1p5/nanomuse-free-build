name: Build nanoMuse Free (experimental)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nano-muse/nanoMuse
          ref: af7d33625581cffad3ccdede98de84caf6b394f8
          submodules: recursive
          path: appsrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply native free chain
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Build native dependencies
        working-directory: appsrc
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export GOROOT="$(go env GOROOT)" GOPATH="$(go env GOPATH)"
          export PATH="$GOPATH/bin:$PATH"
          bash scripts/android/build-natives.sh
      - name: Compile APK
        working-directory: appsrc/android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --tests 'com.openminis.app.provider.openai.FreeChainFailoverTest' --console=plain --no-daemon
      - name: Package sources and APK
        if: always()
        run: |
          mkdir -p output
          find appsrc/android/src/android/app/build/outputs/apk -name '*.apk' -exec cp {} output/nanoMuse-Free-experimental.apk \; 2>/dev/null || true
          cp appsrc/android/src/android/app/src/main/java/com/openminis/app/provider/openai/FreeChainInterceptor.kt output/ 2>/dev/null || true
          tar -czf output/modified-source.tar.gz --exclude=.git --exclude=.gradle --exclude='*/build' --exclude='*/node_modules' -C appsrc .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanoMuse-Free-experimental
          path: output/
          retention-days: 7
          if-no-files-found: error
